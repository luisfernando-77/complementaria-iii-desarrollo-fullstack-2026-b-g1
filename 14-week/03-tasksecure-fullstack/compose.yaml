
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasksecure-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3001:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: tasksecure-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
